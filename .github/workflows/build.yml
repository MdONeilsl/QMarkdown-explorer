# -----------------------------------------------------------------------------
#  Build + test QMarkdown-explorer on Windows and Linux.
#
#  Triggers: push to main, pull request, manual dispatch.
#
#  Each job:
#    1. Checks out the source.
#    2. Verifies the two required PNG icons are present — resources.qrc
#       references them, and rcc fails the build if either is missing.
#    3. Installs the Qt SDK for the job's platform via the matrix.
#    4. Configures with -DBUILD_TESTING=ON.
#    5. Builds in Release mode.
#    6. Runs the test suite headless (QT_QPA_PLATFORM=offscreen).
#
#  Supported platforms: Windows x64 (MSVC), Linux x64 (GCC).
#  macOS is not supported by this workflow.
# -----------------------------------------------------------------------------

name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # A failure on one platform is worth knowing about even if the
      # other passes — do not cancel the whole matrix on first failure.
      fail-fast: false

      matrix:
        include:
          - name: Windows (MSVC)
            os: windows-latest
            qt_arch: win64_msvc2022_64
          - name: Linux (GCC)
            os: ubuntu-latest
            qt_arch: linux_gcc_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required icons are committed
        shell: bash
        run: |
          # resources/resources.qrc references these two files; rcc aborts
          # the build if either is missing.  A dedicated check gives a
          # clear error instead of a mid-build rcc failure.
          missing=0
          for icon in app.png github.png; do
            if [ ! -f "resources/icons/$icon" ]; then
              echo "::error::resources/icons/$icon is missing. Commit it."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # arch comes from the matrix — hardcoding it here would install a
          # Windows Qt package on the Linux runner and fail with
          # "packages ['qt_base'] were not found".
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        # -C Release is required for multi-config generators (MSVC).
        # ctest and cmake --build use different flags for the same concept:
        # --config for build, -C for ctest.
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen