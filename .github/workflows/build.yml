name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC)
            os: windows-latest
            qt_arch: win64_msvc2022_64
          - name: Linux (GCC)
            os: ubuntu-latest
            qt_arch: linux_gcc_64
          - name: macOS (Clang)
            os: macos-latest
            qt_arch: clang_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required icons are committed
        shell: bash
        run: |
          missing=0
          for icon in app.png github.png; do
            if [ ! -f "resources/icons/$icon" ]; then
              echo "::error::resources/icons/$icon is missing. Commit it."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # Qt 6.8.3 is the latest open-source LTS release available
          # through aqtinstall. Version 6.8.4 is commercial-only and
          # cannot be installed via this action.
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Patch Qt for macOS (remove AGL framework)
        if: matrix.name == 'macOS (Clang)'
        shell: bash
        run: |
          # macOS 26 removed the AGL framework, but Qt 6.8.3 still links
          # against it. This sed command comments out the line that adds
          # AGL to the OpenGL link interface. The patch is idempotent:
          # running it twice has no additional effect.
          QT_DIR="${QT_ROOT_DIR}/lib/cmake/Qt6"
          TARGET_FILE="${QT_DIR}/FindWrapOpenGL.cmake"
          if [ -f "$TARGET_FILE" ]; then
            sed -i '' 's/^ *find_library(WrapOpenGL_AGL NAMES AGL)/# &/' "$TARGET_FILE"
            echo "Patched $TARGET_FILE"
          else
            echo "::warning file=$TARGET_FILE not found; AGL patch skipped."
          fi

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen